<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Checker Mail</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            margin: 0;
            padding: 16px;
            color: #333;
        }

        .alert-box {
            background-color: #fff0f0;
            border: 1px solid #ffd6d6;
            color: #d32f2f;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: 700;
        }

        .card p.sub-text {
            color: #777;
            font-size: 13px;
            margin-top: 0;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 120px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            outline: none;
            resize: vertical;
            background-color: #fafafa;
        }

        textarea:focus {
            border-color: #3b82f6;
            background-color: #fff;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-read {
            background-color: #3b82f6;
            color: #ffffff;
        }

        .btn-read:hover {
            background-color: #2563eb;
        }

        .btn-auto {
            background-color: #f3f4f6;
            color: #1f2937;
            border: 1px solid #e5e7eb;
        }

        .btn-auto:hover {
            background-color: #e5e7eb;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        th, td {
            border: 1px solid #f0f0f0;
            padding: 12px 10px;
            text-align: left;
            font-size: 13px;
            vertical-align: middle;
            word-break: break-all;
        }

        th {
            background-color: #ffffff;
            font-weight: 700;
            color: #111827;
        }

        .badge-success {
            color: #16a34a;
            font-weight: 700;
        }

        .badge-error {
            color: #dc2626;
            font-weight: 700;
        }

        a.link-btn {
            color: #2563eb;
            text-decoration: underline;
        }

        .text-muted {
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="alert-box">
        ⚠ LƯU Ý: Hòm thư hệ thống.
    </div>

    <div class="card">
        <h3>Danh sách email</h3>
        <p class="sub-text">Nhập danh sách định dạng: <code>email|password</code> (Mỗi tài khoản 1 dòng)</p>
        
        <textarea id="emailInput" placeholder="cool_cailah64@annnekkk.com|Gj4hJphjGwAH"></textarea>
        
        <div class="btn-group">
            <button class="btn btn-read" id="btnRead" onclick="processVerify(false)">
                📩 Đọc mail
            </button>
            <button class="btn btn-auto" id="btnAuto" onclick="processVerify(true)">
                ⚡ Xác minh tự động
            </button>
        </div>
    </div>

    <div class="card">
        <h3>KẾT QUẢ HIỂN THỊ:</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 40%;">Tài khoản / Email</th>
                        <th style="width: 20%;">Trạng thái</th>
                        <th style="width: 15%;">Mã OTP</th>
                        <th style="width: 25%;">Link xác minh</th>
                    </tr>
                </thead>
                <tbody id="resultBody">
                    <tr>
                        <td colspan="4" style="text-align: center;" class="text-muted">Chờ nhập danh sách...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function processVerify(isAutoClick) {
            const btnRead = document.getElementById('btnRead');
            const btnAuto = document.getElementById('btnAuto');
            const input = document.getElementById('emailInput').value.trim();
            const tbody = document.getElementById('resultBody');

            if (!input) {
                alert("Vui lòng nhập ít nhất 1 tài khoản!");
                return;
            }

            const lines = input.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            // Khóa nút trong quá trình xử lý
            btnRead.disabled = true;
            btnAuto.disabled = true;
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;" class="text-muted">Đang xử lý ${lines.length} tài khoản...</td></tr>`;

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        accounts: lines,
                        auto_click: isAutoClick
                    })
                });

                const data = await response.json();
                tbody.innerHTML = '';

                if (data.results && data.results.length > 0) {
                    data.results.forEach((item) => {
                        const tr = document.createElement('tr');
                        
                        let linkHtml = `<span class="text-muted">${item.link_status || 'Chưa thấy yêu cầu đăng nhập'}</span>`;
                        
                        if (item.link) {
                            let statusText = item.link_status ? ` (${item.link_status})` : '';
                            linkHtml = `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="link-btn">Link</a>${statusText}`;
                        }

                        tr.innerHTML = `
                            <td>${item.email}</td>
                            <td><span class="${item.status === 'Thành công' ? 'badge-success' : 'badge-error'}">${item.status}</span></td>
                            <td><strong>${item.otp}</strong></td>
                            <td>${linkHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #dc2626;">Không nhận được dữ liệu từ Server!</td></tr>`;
                }

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #dc2626;">Lỗi kết nối Server!</td></tr>`;
            } finally {
                btnRead.disabled = false;
                btnAuto.disabled = false;
            }
        }
    </script>
</body>
</html>
