<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Checker Mail</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f5f7; margin: 0; padding: 16px; color: #333; }
        .alert-box { background-color: #fff0f0; border: 1px solid #ffd6d6; color: #d32f2f; padding: 12px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
        .card { background: #ffffff; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
        .card h3 { margin-top: 0; margin-bottom: 8px; font-size: 18px; font-weight: 700; }
        .card p.sub-text { color: #777; font-size: 13px; margin-top: 0; margin-bottom: 12px; }
        textarea { width: 100%; height: 120px; border: 1px solid #e0e0e0; border-radius: 10px; padding: 12px; font-family: monospace; font-size: 13px; outline: none; resize: vertical; background-color: #fafafa; }
        textarea:focus { border-color: #3b82f6; background-color: #fff; }
        .btn-group { display: flex; gap: 10px; margin-top: 14px; }
        .btn { flex: 1; padding: 12px 16px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s ease; }
        .btn-read { background-color: #3b82f6; color: #ffffff; }
        .btn-read:hover { background-color: #2563eb; }
        .btn-auto { background-color: #10b981; color: #ffffff; }
        .btn-auto:hover { background-color: #059669; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { border: 1px solid #f0f0f0; padding: 12px 10px; text-align: left; font-size: 13px; vertical-align: middle; word-break: break-all; }
        th { background-color: #ffffff; font-weight: 700; color: #111827; }
        .badge-success { color: #16a34a; font-weight: 700; }
        .badge-error { color: #dc2626; font-weight: 700; }
        a.link-btn { color: #2563eb; text-decoration: underline; font-weight: 600; }
        .text-muted { color: #6b7280; }
        .status-error-text { color: #dc2626; font-size: 12px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab { flex: 1; padding: 10px; border: 1px solid #3b82f6; border-radius: 10px; background: #fff; color: #3b82f6; font-size: 14px; font-weight: 600; cursor: pointer; }
        .tab.active { background: #3b82f6; color: #fff; }
    </style>
</head>
<body>

    <div class="alert-box" id="alertBox">⚠ LƯU Ý: Hòm thư hệ thống.</div>

    <div class="card">
        <h3>Danh sách email</h3>
        <div class="tabs">
            <button class="tab active" id="tabSystem" onclick="setSource('system')">Mail hệ thống</button>
            <button class="tab" id="tabIcloud" onclick="setSource('icloud')">Mail iCloud</button>
        </div>
        <p class="sub-text" id="hintText">Nhập danh sách định dạng: <code>email|password</code> (Mỗi tài khoản 1 dòng)</p>
        
        <textarea id="emailInput" placeholder="Vui lòng nhập tài khoản|mật khẩu vào (Mỗi tài khoản 1 dòng)"></textarea>
        
        <div class="btn-group">
            <button class="btn btn-read" id="btnRead" onclick="processVerify(false)">
                📩 Đọc mail (Chỉ lấy link/OTP)
            </button>
            <button class="btn btn-auto" id="btnAuto" onclick="processVerify(true)">
                ⚡ Xác minh tự động (Tự nhảy tab bấm link)
            </button>
        </div>
    </div>

    <div class="card">
        <h3>KẾT QUẢ HIỂN THỊ:</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 35%;">Tài khoản / Email</th>
                        <th style="width: 15%;">Trạng thái</th>
                        <th style="width: 15%;">Mã OTP</th>
                        <th style="width: 35%;">Link xác minh</th>
                    </tr>
                </thead>
                <tbody id="resultBody">
                    <tr>
                        <td colspan="4" style="text-align: center;" class="text-muted">Chờ nhập danh sách...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SOURCE_TEXT = {
            system: {
                alert: "⚠ LƯU Ý: Hòm thư hệ thống.",
                hint: "Nhập danh sách định dạng: <code>email|password</code> (Mỗi tài khoản 1 dòng)",
                ph: "Vui lòng nhập tài khoản|mật khẩu vào (Mỗi tài khoản 1 dòng)"
            },
            icloud: {
                alert: "⚠ LƯU Ý: Hòm thư iCloud của hệ thống, chỉ đọc mail trong 10 phút gần nhất.",
                hint: "Chỉ nhập <code>email</code>, mỗi email một dòng (không cần mật khẩu).",
                ph: "email@icloud.com"
            }
        };
        let source = 'system';

        function setSource(s) {
            source = s;
            document.getElementById('tabSystem').classList.toggle('active', s === 'system');
            document.getElementById('tabIcloud').classList.toggle('active', s === 'icloud');
            document.getElementById('alertBox').textContent = SOURCE_TEXT[s].alert;
            document.getElementById('hintText').innerHTML = SOURCE_TEXT[s].hint;
            const input = document.getElementById('emailInput');
            input.placeholder = SOURCE_TEXT[s].ph;
            input.value = '';   // xoá để không gửi nhầm định dạng giữa hai tab
            document.getElementById('resultBody').innerHTML =
                '<tr><td colspan="4" style="text-align: center;" class="text-muted">Chờ nhập danh sách...</td></tr>';
        }

        async function processVerify(isOpenTabs) {
            const btnRead = document.getElementById('btnRead');
            const btnAuto = document.getElementById('btnAuto');
            const input = document.getElementById('emailInput').value.trim();
            const tbody = document.getElementById('resultBody');

            if (!input) {
                alert("Vui lòng nhập tài khoản|mật khẩu vào!");
                return;
            }

            const lines = input.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            // Mở sẵn 1 tab trống ngay khi click chuột để không bị cơ chế chặn Pop-up của Chrome
            let runnerWin = null;
            if (isOpenTabs) {
                runnerWin = window.open('about:blank', '_blank');
            }

            btnRead.disabled = true;
            btnAuto.disabled = true;
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;" class="text-muted">Đang quét ${lines.length} tài khoản...</td></tr>`;

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accounts: lines, source: source })
                });

                const data = await response.json();
                tbody.innerHTML = '';

                let validLinks = [];

                if (data.results && data.results.length > 0) {
                    data.results.forEach((item) => {
                        const tr = document.createElement('tr');
                        let linkHtml = `<span class="text-muted">${item.link_status || 'Chưa thấy link'}</span>`;

                        if (item.link) {
                            validLinks.push(item.link);
                            linkHtml = `<a href="${item.link}" target="_blank" class="link-btn">Mở link thủ công</a>`;
                        } else if (item.status === 'Thất bại') {
                            linkHtml = `<span class="status-error-text">${item.link_status || 'Lỗi'}</span>`;
                        }

                        tr.innerHTML = `
                            <td>${item.email}</td>
                            <td><span class="${item.status === 'Thành công' ? 'badge-success' : 'badge-error'}">${item.status}</span></td>
                            <td><strong>${item.otp}</strong></td>
                            <td>${linkHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    // Tab tự động chuyển hướng lần lượt qua các link xác minh (cách nhau 3 giây)
                    if (isOpenTabs && runnerWin && validLinks.length > 0) {
                        let idx = 0;
                        function step() {
                            if (idx < validLinks.length && !runnerWin.closed) {
                                runnerWin.location.href = validLinks[idx];
                                idx++;
                                if (idx < validLinks.length) {
                                    setTimeout(step, 3000);
                                }
                            }
                        }
                        step();
                    } else if (runnerWin && validLinks.length === 0) {
                        runnerWin.close();
                    }

                } else {
                    if (runnerWin) runnerWin.close();
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;" class="status-error-text">Không nhận được dữ liệu phản hồi!</td></tr>`;
                }

            } catch (err) {
                if (runnerWin) runnerWin.close();
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;" class="status-error-text">Lỗi kết nối Server!</td></tr>`;
            } finally {
                btnRead.disabled = false;
                btnAuto.disabled = false;
            }
        }
    </script>
</body>
</html>
