<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Checker Mail</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f5f5f7; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .alert { background: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        textarea { width: 100%; height: 120px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-family: monospace; box-sizing: border-box; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-read { background: #2196F3; color: white; }
        .btn-read:hover { background: #1e88e5; }
        .btn-auto { background: #ffffff; color: #333; border: 1px solid #ddd; }
        .btn-auto:hover { background: #f0f0f0; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; font-size: 14px; word-break: break-all; }
        th { background: #fafafa; }
        .badge-success { color: #2e7d32; font-weight: bold; }
        .badge-error { color: #c62828; font-weight: bold; }
    </style>
</head>
<body>

    <div class="alert">
        ⚠ <strong>LƯU Ý:</strong> Hòm thư hệ thống.
    </div>

    <div class="card">
        <h3>Danh sách email</h3>
        <p style="font-size: 13px; color: #666;">Nhập danh sách định dạng: <code>email|password</code> (Mỗi tài khoản 1 dòng)</p>
        
        <!-- Dùng placeholder để chữ hiện mờ, bấm vào nhập là không cần xoá chữ cũ -->
        <textarea id="emailInput" placeholder="Hãy nhập email của bạn (ví dụ: email|password)"></textarea>
        
        <div class="btn-group">
            <button class="btn btn-read" id="btnRead" onclick="processVerify(false)">
                📩 Đọc mail
            </button>
            <button class="btn btn-auto" id="btnAuto" onclick="processVerify(true)">
                ⚡ Xác minh tự động
            </button>
        </div>
    </div>

    <div class="card">
        <h3>KẾT QUẢ HIỂN THỊ:</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Tài khoản / Email</th>
                        <th>Trạng thái</th>
                        <th>Mã OTP</th>
                        <th>Link xác minh</th>
                    </tr>
                </thead>
                <tbody id="resultBody">
                    <tr>
                        <td colspan="4" style="text-align: center; color: #888;">Chờ nhập danh sách...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function processVerify(isAutoClick) {
            const btnRead = document.getElementById('btnRead');
            const btnAuto = document.getElementById('btnAuto');
            const input = document.getElementById('emailInput').value.trim();
            const tbody = document.getElementById('resultBody');

            if (!input) {
                alert("Vui lòng nhập ít nhất 1 tài khoản!");
                return;
            }

            const lines = input.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            // Mở trước các tab trống trực tiếp từ thao tác click để qua mặt bộ chặn Pop-up di động
            let newTabs = [];
            if (isAutoClick) {
                for (let i = 0; i < lines.length; i++) {
                    let tab = window.open('about:blank', '_blank');
                    newTabs.push(tab);
                }
            }

            btnRead.disabled = true;
            btnAuto.disabled = true;
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">Đang xử lý ${lines.length} tài khoản...</td></tr>`;

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        accounts: lines,
                        auto_click: isAutoClick
                    })
                });

                const data = await response.json();
                tbody.innerHTML = '';

                if (data.results && data.results.length > 0) {
                    data.results.forEach((item, index) => {
                        const tr = document.createElement('tr');
                        let linkStatusText = "Chưa bấm";

                        // Nếu chọn xác minh tự động và tìm thấy link
                        if (isAutoClick && newTabs[index]) {
                            if (item.link) {
                                newTabs[index].location.href = item.link; // Điều hướng tab đã mở sẵn tới link
                                linkStatusText = "Đã mở tab xác minh";
                            } else {
                                newTabs[index].close(); // Đóng tab thừa nếu không có link
                                linkStatusText = "Không có link";
                            }
                        }

                        let linkHtml = '<span style="color:#888;">Không có</span>';
                        if (item.link) {
                            linkHtml = `<a href="${item.link}" target="_blank" rel="noopener noreferrer" style="color: #1976d2;">Link</a> (${linkStatusText})`;
                        } else if (item.link_status) {
                            linkHtml = `<span style="color:#888;">${item.link_status}</span>`;
                        }

                        tr.innerHTML = `
                            <td>${item.email}</td>
                            <td><span class="${item.status === 'Thành công' ? 'badge-success' : 'badge-error'}">${item.status}</span></td>
                            <td><strong>${item.otp}</strong></td>
                            <td>${linkHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    // Đóng tất cả tab nếu gặp lỗi
                    newTabs.forEach(t => t && t.close());
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Không nhận được dữ liệu!</td></tr>`;
                }

            } catch (err) {
                newTabs.forEach(t => t && t.close());
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Lỗi kết nối Server!</td></tr>`;
            } finally {
                btnRead.disabled = false;
                btnAuto.disabled = false;
            }
        }
    </script>
</body>
</html>
