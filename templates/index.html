<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Checker Mail</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            margin: 0;
            padding: 16px;
            color: #333;
        }

        .alert-box {
            background-color: #fff0f0;
            border: 1px solid #ffd6d6;
            color: #d32f2f;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: 700;
        }

        .file-upload-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .file-input-label {
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .file-input-label:hover {
            background-color: #e5e7eb;
        }

        .file-name-info {
            font-size: 13px;
            color: #4b5563;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-read {
            background-color: #3b82f6;
            color: #ffffff;
        }

        .btn-read:hover {
            background-color: #2563eb;
        }

        .btn-auto {
            background-color: #f3f4f6;
            color: #1f2937;
            border: 1px solid #e5e7eb;
        }

        .btn-auto:hover {
            background-color: #e5e7eb;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        th, td {
            border: 1px solid #f0f0f0;
            padding: 12px 10px;
            text-align: left;
            font-size: 13px;
            vertical-align: middle;
            word-break: break-all;
        }

        th {
            background-color: #ffffff;
            font-weight: 700;
            color: #111827;
        }

        .badge-success {
            color: #16a34a;
            font-weight: 700;
        }

        .badge-error {
            color: #dc2626;
            font-weight: 700;
        }

        a.link-btn {
            color: #2563eb;
            text-decoration: underline;
        }

        .text-muted {
            color: #6b7280;
        }

        .status-error-text {
            color: #dc2626;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="alert-box">
        ⚠ LƯU Ý: Hòm thư hệ thống.
    </div>

    <div class="card">
        <h3>Danh sách tài khoản</h3>
        
        <div class="file-upload-box">
            <label class="file-input-label" for="fileInput">📁 Chọn file tài khoản (.txt)</label>
            <input type="file" id="fileInput" accept=".txt,.csv" style="display: none;" onchange="handleFileSelect(event)">
            <span class="file-name-info" id="fileNameInfo">Chưa chọn file nào</span>
        </div>

        <div class="btn-group">
            <button class="btn btn-read" id="btnRead" onclick="processVerify(false)">
                📩 Đọc mail
            </button>
            <button class="btn btn-auto" id="btnAuto" onclick="processVerify(true)">
                ⚡ Xác minh tự động (Mở Tab)
            </button>
        </div>
    </div>

    <div class="card">
        <h3>KẾT QUẢ HIỂN THỊ:</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 35%;">Tài khoản / Email</th>
                        <th style="width: 15%;">Trạng thái</th>
                        <th style="width: 15%;">Mã OTP</th>
                        <th style="width: 35%;">Link xác minh</th>
                    </tr>
                </thead>
                <tbody id="resultBody">
                    <tr>
                        <td colspan="4" style="text-align: center;" class="text-muted">Chưa có tài khoản nào được nạp...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let loadedAccounts = [];

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('fileNameInfo').innerText = file.name;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                loadedAccounts = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                
                // Hiển thị ngay danh sách email vừa nạp vào bảng bên dưới
                renderInitialTable(loadedAccounts);
            };
            reader.readAsText(file);
        }

        function renderInitialTable(accounts) {
            const tbody = document.getElementById('resultBody');
            tbody.innerHTML = '';

            if (accounts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;" class="text-muted">File rỗng hoặc không đúng định dạng!</td></tr>`;
                return;
            }

            accounts.forEach(line => {
                const parts = line.split('|');
                const email = parts[0] ? parts[0].trim() : line;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${email}</td>
                    <td><span class="text-muted">Chờ xử lý</span></td>
                    <td><span class="text-muted">N/A</span></td>
                    <td><span class="text-muted">Sẵn sàng</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function processVerify(isOpenTabs) {
            const btnRead = document.getElementById('btnRead');
            const btnAuto = document.getElementById('btnAuto');
            const tbody = document.getElementById('resultBody');

            if (loadedAccounts.length === 0) {
                alert("Vui lòng chọn file chứa danh sách tài khoản trước!");
                return;
            }

            let openedTabs = [];
            if (isOpenTabs) {
                for (let i = 0; i < loadedAccounts.length; i++) {
                    let win = window.open('about:blank', '_blank');
                    openedTabs.push(win);
                }
            }

            btnRead.disabled = true;
            btnAuto.disabled = true;
            
            // Cập nhật trạng thái đang quét
            const rows = tbody.querySelectorAll('tr');
            rows.forEach(row => {
                const statusCell = row.children[1];
                if (statusCell) statusCell.innerHTML = `<span class="text-muted">Đang quét...</span>`;
            });

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accounts: loadedAccounts })
                });

                const data = await response.json();
                tbody.innerHTML = '';

                if (data.results && data.results.length > 0) {
                    data.results.forEach((item, index) => {
                        const tr = document.createElement('tr');
                        let tabStatus = "";

                        if (isOpenTabs) {
                            if (openedTabs[index]) {
                                if (item.link) {
                                    openedTabs[index].location.href = item.link;
                                    tabStatus = " <span class='text-muted'>(Đã mở tab)</span>";
                                } else {
                                    openedTabs[index].close();
                                    tabStatus = " <span class='text-muted'>(Không có link)</span>";
                                }
                            } else {
                                tabStatus = " <span class='status-error-text'>(Bị trình duyệt chặn Pop-up)</span>";
                            }
                        }

                        let linkHtml = `<span class="text-muted">${item.link_status || 'Chưa thấy yêu cầu đăng nhập'}</span>`;
                        if (item.link) {
                            linkHtml = `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="link-btn">Link</a>${tabStatus}`;
                        } else if (item.link_status && item.status === 'Thất bại') {
                            linkHtml = `<span class="status-error-text">${item.link_status}</span>`;
                        }

                        tr.innerHTML = `
                            <td>${item.email}</td>
                            <td><span class="${item.status === 'Thành công' ? 'badge-success' : 'badge-error'}">${item.status}</span></td>
                            <td><strong>${item.otp}</strong></td>
                            <td>${linkHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    openedTabs.forEach(t => t && t.close());
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;" class="status-error-text">Không nhận được dữ liệu phản hồi!</td></tr>`;
                }

            } catch (err) {
                openedTabs.forEach(t => t && t.close());
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;" class="status-error-text">Lỗi kết nối Server!</td></tr>`;
            } finally {
                btnRead.disabled = false;
                btnAuto.disabled = false;
            }
        }
    </script>
</body>
</html>
